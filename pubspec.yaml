name: appliquation_mobile
description: "Une application mobile Flutter moderne de Chatbot IA"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  google_fonts: ^6.1.0
  shared_preferences: ^2.2.2
  flutter_spinkit: ^5.2.0
  speech_to_text: ^6.6.2        # 🎤 Micro → Texte (reconnaissance vocale)
  flutter_tts: 4.0.2           # 🔊 Texte → Voix (Lily parle à voix haute)
  flutter_local_notifications: ^19.5.0
  fl_chart: ^0.71.0
  google_sign_in: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
